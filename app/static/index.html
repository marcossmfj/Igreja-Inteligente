<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comando Central - Igreja Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; letter-spacing: -0.02em; background-color: #F8FAFC; }
        [v-cloak] { display: none; }
        .modal-blur { backdrop-filter: blur(8px); background: rgba(15, 23, 42, 0.7); }
        .service-card { transition: all 0.3s ease; }
        .day-btn { border: 2px solid #E2E8F0; padding: 1rem; border-radius: 1.5rem; font-weight: 900; font-size: 0.875rem; transition: all 0.3s; width: 100%; text-align: center; background: white; }
        .day-btn.active { background-color: #4F46E5; border-color: #4F46E5; color: white; box-shadow: 0 10px 15px -3px rgba(199, 210, 254, 1); }
    </style>
</head>
<body class="text-slate-900">
    <div id="app" v-cloak class="min-h-screen flex flex-col">
        
        <!-- LOGIN -->
        <div v-if="!token" class="flex-1 flex justify-center items-center bg-slate-900 p-6">
            <div class="bg-white p-12 rounded-[3rem] shadow-2xl w-full max-w-md text-center">
                <h2 class="text-4xl font-black mb-8 text-indigo-600 italic tracking-tighter uppercase">Igreja Inteligente</h2>
                <form @submit.prevent="login" class="space-y-4">
                    <input v-model="loginData.username" type="email" placeholder="E-mail" class="w-full bg-slate-50 border-2 p-5 rounded-[2rem] outline-none font-bold focus:border-indigo-500">
                    <input v-model="loginData.password" type="password" placeholder="Senha" class="w-full bg-slate-50 border-2 p-5 rounded-[2rem] outline-none font-bold focus:border-indigo-500">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-6 rounded-[2rem] font-black text-xl shadow-xl">Acessar</button>
                </form>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div v-else class="flex flex-col min-h-screen">
            <nav class="bg-white border-b px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="bg-indigo-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-black italic shadow-lg shadow-indigo-200">II</div>
                    <div>
                        <h1 class="text-sm font-black tracking-tighter uppercase italic text-indigo-600 leading-none">Igreja Inteligente</h1>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">{{ churchName || 'Dashboard' }}</p>
                    </div>
                </div>

                <div class="flex items-center gap-8">
                    <div class="flex gap-6 font-extrabold text-[11px] uppercase tracking-wider">
                        <button @click="setTab('membros')" :class="tab==='membros' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-400'">Membros</button>
                        <button @click="setTab('visitantes')" :class="tab==='visitantes' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-400'">Visitantes</button>
                        <button @click="setTab('escalas')" :class="tab==='escalas' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-400'">Escalas</button>
                        <button @click="setTab('documentos')" :class="tab==='documentos' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-400'">Documentos</button>
                        <button @click="setTab('linguajar')" :class="tab==='linguajar' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-400'">Linguajar</button>
                    </div>

                    <div class="h-8 w-[1px] bg-slate-100"></div>

                    <div class="flex items-center gap-4">
                        <div class="text-right">
                            <p class="text-[10px] font-black text-slate-400 uppercase leading-none">Usuário</p>
                            <p class="text-xs font-bold text-slate-900">{{ userName || 'Pastor' }}</p>
                        </div>
                        <button @click="logout" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-5 py-2.5 rounded-2xl font-black text-[10px] uppercase tracking-wider transition-all border border-rose-100">Sair</button>
                    </div>
                </div>
            </nav>

            <main class="container mx-auto max-w-6xl p-8 flex-1">
                <tab-membros 
                    v-if="tab==='membros'" 
                    :members="members" 
                    @export-pdf="exportPDF"
                    @show-modal-add="showModalAdd=true"
                    @open-edit-member="openEditMember"
                    @delete-member="deleteMember"
                ></tab-membros>

                <tab-visitantes 
                    v-if="tab==='visitantes'" 
                    :members="members"
                    @export-pdf="exportPDF"
                    @show-modal-add-visitor="showModalAddVisitor=true"
                    @open-promotion="openPromotion"
                ></tab-visitantes>

                <tab-escalas 
                    v-if="tab==='escalas'" 
                    :grouped-schedules="groupedSchedules" 
                    v-model:editing-id="editingId"
                    :get-qualified-members="getQualifiedMembers"
                    :positions="positions"
                    @show-modal-template="showModalTemplate=true"
                    @show-modal-manual="showModalManual=true"
                    @show-modal-auto="showModalAuto=true"
                    @send-event-notifications="sendEventNotifications"
                    @open-quick-add="openQuickAdd"
                    @save-edit="saveEdit"
                    @remove-vaga="removeVaga"
                    @suggest-substitute="suggestSubstitute"
                ></tab-escalas>

                <tab-documentos 
                    v-if="tab==='documentos'" 
                    :documents="documents"
                    @show-modal-upload="showModalUploadDoc=true"
                    @delete-doc="deleteDoc"
                ></tab-documentos>

                <tab-linguajar 
                    v-if="tab==='linguajar'" 
                    :positions="positions"
                    @refresh="loadAll"
                ></tab-linguajar>
            </main>
        </div>

        <!-- MODAIS -->
        <modal-upload-doc
            :show="showModalUploadDoc"
            @close="showModalUploadDoc=false"
            @upload="uploadDoc"
        ></modal-upload-doc>

        <modal-template 
            :show="showModalTemplate" 
            :templates="templates" 
            :funcoes="funcoes" 
            :get-pos-name="getPosName"
            @close="showModalTemplate=false"
            @delete-template="deleteTemplate"
            @save-template="saveTemplate"
        ></modal-template>

        <modal-geracao-ia 
            :show="showModalAuto" 
            :templates="templates"
            @close="showModalAuto=false"
            @run-auto-batch="runAutoBatch"
        ></modal-geracao-ia>

        <modal-escala-manual 
            :show="showModalManual" 
            :positions="positions" 
            :get-qualified-members="getQualifiedMembers"
            @close="showModalManual=false"
            @run-manual-add="runManualAdd"
        ></modal-escala-manual>

        <modal-member 
            :show="showModalAdd" 
            :cargos="cargos" 
            :funcoes="funcoes" 
            :get-pos-name="getPosName" 
            :member="newMember"
            :is-edit="false"
            @close="showModalAdd=false"
            @save="addMember"
        ></modal-member>

        <modal-member 
            :show="showModalEdit" 
            :cargos="cargos" 
            :funcoes="funcoes" 
            :get-pos-name="getPosName" 
            :member="editingMember"
            :is-edit="true"
            @close="showModalEdit=false"
            @save="updateMember"
        ></modal-member>

        <modal-visitor 
            :show="showModalAddVisitor" 
            @close="showModalAddVisitor=false"
            @save="addVisitor"
        ></modal-visitor>

        <modal-promote 
            :show="showModalPromote" 
            :target-promotion="targetPromotion" 
            :cargos="cargos" 
            :funcoes="funcoes"
            @close="showModalPromote=false"
            @confirm="confirmPromotion"
        ></modal-promote>

        <modal-quick-add 
            :show="showModalQuickAdd" 
            :positions="funcoes" 
            :get-qualified-members="getQualifiedMembers" 
            :initial-data="quickAddData"
            @close="showModalQuickAdd=false"
            @save="runQuickAdd"
        ></modal-quick-add>

        <modal-subs
            :show="showModalSubs"
            :substitutes="substitutes"
            @close="showModalSubs=false"
            @apply="applySubstitute"
        ></modal-subs>

        <modal-config-cargos
            v-if="showModalCargos"
            :positions="positions"
            @close="showModalCargos=false"
            @refresh="loadAll"
        ></modal-config-cargos>

        </div>
    <script type="module">
        import TabMembros from './components/TabMembros.js';
        import TabVisitantes from './components/TabVisitantes.js';
        import TabEscalas from './components/TabEscalas.js';
        import TabDocumentos from './components/TabDocumentos.js';
        import TabLinguajar from './components/TabLinguajar.js';
        import ModalGeracaoIA from './components/ModalGeracaoIA.js';
        import ModalEscalaManual from './components/ModalEscalaManual.js';
        import ModalTemplate from './components/ModalTemplate.js';
        import ModalMember from './components/ModalMember.js';
        import ModalVisitor from './components/ModalVisitor.js';
        import ModalPromote from './components/ModalPromote.js';
        import ModalQuickAdd from './components/ModalQuickAdd.js';
        import ModalSubs from './components/ModalSubs.js';
        import ModalUploadDoc from './components/ModalUploadDoc.js';

        const { createApp, ref, computed, onMounted } = Vue;
        
        createApp({
            components: {
                'tab-membros': TabMembros,
                'tab-visitantes': TabVisitantes,
                'tab-escalas': TabEscalas,
                'tab-documentos': TabDocumentos,
                'tab-linguajar': TabLinguajar,
                'modal-geracao-ia': ModalGeracaoIA,
                'modal-escala-manual': ModalEscalaManual,
                'modal-template': ModalTemplate,
                'modal-member': ModalMember,
                'modal-visitor': ModalVisitor,
                'modal-promote': ModalPromote,
                'modal-quick-add': ModalQuickAdd,
                'modal-subs': ModalSubs,
                'modal-upload-doc': ModalUploadDoc
            },
            setup() {
                const token = ref(localStorage.getItem('token') || '');
                const userName = ref(localStorage.getItem('userName') || '');
                const churchName = ref(localStorage.getItem('churchName') || '');
                const tab = ref('escalas');
                const members = ref([]); const schedules = ref([]); const positions = ref([]); const documents = ref([]); const templates = ref([]);
                const loginData = ref({ username: 'pastor1@test.com', password: '123456' });
                const editingMember = ref({ id: null, name: '', whatsapp: '', status: 'Ativo', endereco: '', data_batismo: '', cargo_id: '', selectedFuncoes: [] });
                const editingId = ref(null);
                const showModalAdd = ref(false); const showModalAddVisitor = ref(false); 
                const showModalPromote = ref(false); const showModalAuto = ref(false); 
                const showModalManual = ref(false); const showModalQuickAdd = ref(false); const showModalSubs = ref(false);
                const showModalEdit = ref(false); const showModalTemplate = ref(false); const showModalUploadDoc = ref(false);
                const targetPromotion = ref(null);
                const substitutes = ref([]); const targetSchedule = ref(null);
                const quickAddData = ref(null);
                const newMember = ref({ name: '', whatsapp: '', status: 'Ativo', endereco: '', data_batismo: '', cargo_id: '', selectedFuncoes: [] });

                const headers = () => ({ 'Authorization': `Bearer ${token.value}`, 'Content-Type': 'application/json' });
                
                const cargos = computed(() => positions.value.filter(p => p.type === 'Cargo'));
                const funcoes = computed(() => positions.value.filter(p => p.type === 'Função'));

                const getQualifiedMembers = (posId) => {
                    if(!posId) return members.value.filter(m => m.status === 'Ativo');
                    return members.value.filter(m => m.status === 'Ativo' && m.positions.some(p => p.id == posId));
                };

                const groupedSchedules = computed(() => {
                    const groups = {};
                    schedules.value.forEach(s => {
                        const key = `${s.event_name}-${s.event_date}`;
                        if (!groups[key]) groups[key] = [];
                        groups[key].push(s);
                    });
                    return groups;
                });

                const loadAll = async () => {
                    if (!token.value) return;
                    try {
                        const [rM, rS, rP, rD, rT] = await Promise.all([
                            fetch('/members/', { headers: headers() }),
                            fetch('/schedules/', { headers: headers() }),
                            fetch('/members/positions', { headers: headers() }),
                            fetch('/docs/', { headers: headers() }),
                            fetch('/schedules/templates', { headers: headers() })
                        ]);
                        if(rM.status === 401) return logout();
                        if(rM.ok) members.value = await rM.json();
                        if(rS.ok) schedules.value = await rS.json();
                        if(rP.ok) positions.value = await rP.json();
                        if(rD.ok) documents.value = await rD.json();
                        if(rT.ok) templates.value = await rT.json();
                    } catch (e) {
                        console.error("Erro ao carregar dados:", e);
                    }
                };

                const login = async () => {
                    const fd = new URLSearchParams(); fd.append('username', loginData.value.username); fd.append('password', loginData.value.password);
                    try {
                        const r = await fetch('/auth/login', { method: 'POST', body: fd });
                        if (r.ok) { 
                            const data = await r.json();
                            token.value = data.access_token; 
                            userName.value = data.user_name;
                            churchName.value = data.church_name;
                            localStorage.setItem('token', token.value); 
                            localStorage.setItem('userName', userName.value); 
                            localStorage.setItem('churchName', churchName.value); 
                            loadAll(); 
                        }
                        else { alert("Login falhou! Verifique e-mail e senha."); }
                    } catch (e) { alert("Erro de conexão."); }
                };

                const logout = () => { 
                    token.value = ''; 
                    userName.value = '';
                    churchName.value = '';
                    localStorage.removeItem('token'); 
                    localStorage.removeItem('userName'); 
                    localStorage.removeItem('churchName'); 
                };

                const runAutoBatch = async (data) => {
                    const payload = { 
                        ...data, 
                        start_date: new Date(data.start_date).toISOString(),
                        end_date: new Date(data.end_date).toISOString()
                    };
                    const r = await fetch('/schedules/auto-generate-batch', { method: 'POST', headers: headers(), body: JSON.stringify(payload) });
                    const res = await r.json(); alert(res.message); showModalAuto.value = false; loadAll();
                };

                const runManualAdd = async (data) => {
                    await fetch('/schedules/', { method: 'POST', headers: headers(), body: JSON.stringify(data) });
                    showModalManual.value = false; loadAll();
                };

                const exportPDF = () => {
                    window.open(`/members/export-pdf?token=${token.value}`, '_blank');
                };

                const setTab = (t) => tab.value = t;

                const addMember = async (memberData) => {
                    const payload = {
                        ...memberData,
                        position_ids: [
                            ...(memberData.cargo_id ? [memberData.cargo_id] : []),
                            ...memberData.selectedFuncoes
                        ],
                        data_batismo: memberData.data_batismo ? new Date(memberData.data_batismo).toISOString() : null
                    };
                    await fetch('/members/create-with-positions', { method: 'POST', headers: headers(), body: JSON.stringify(payload) });
                    showModalAdd.value = false; loadAll();
                    newMember.value = { name: '', whatsapp: '', status: 'Ativo', endereco: '', data_batismo: '', cargo_id: '', selectedFuncoes: [] };
                };

                const addVisitor = async (visitorData) => {
                    await fetch('/visitors/', { method: 'POST', headers: headers(), body: JSON.stringify(visitorData) });
                    showModalAddVisitor.value = false; loadAll();
                };

                const openPromotion = (member) => { targetPromotion.value = member; showModalPromote.value = true; };
                const confirmPromotion = async (promotionData) => {
                    if (!promotionData.cargo_id) return alert("Selecione o Cargo.");
                    const payload = {
                        cargo_id: promotionData.cargo_id,
                        funcao_ids: promotionData.selectedFuncoes
                    };
                    const r = await fetch(`/visitors/${targetPromotion.value.id}/promote`, { 
                        method: 'PATCH', 
                        headers: headers(),
                        body: JSON.stringify(payload)
                    });
                    if (r.ok) {
                        showModalPromote.value = false; 
                        loadAll();
                    } else {
                        const err = await r.json();
                        alert("Erro ao promover: " + (err.detail || "Falha na requisição"));
                    }
                };

                const openQuickAdd = (ev) => { 
                    quickAddData.value = { event_name: ev.event_name, event_date: ev.event_date }; 
                    showModalQuickAdd.value = true; 
                };
                
                const runQuickAdd = async (data) => { 
                    await fetch('/schedules/', { method: 'POST', headers: headers(), body: JSON.stringify(data) }); 
                    showModalQuickAdd.value = false; loadAll(); 
                };

                const saveEdit = async (s) => { 
                    await fetch(`/schedules/${s.id}`, { method: 'PATCH', headers: headers(), body: JSON.stringify({ member_id: s.member_id }) }); 
                    editingId.value = null; loadAll(); 
                };

                const removeVaga = async (id) => { 
                    if (confirm("Remover esta vaga definitivamente?")) { await fetch(`/schedules/${id}`, { method: 'DELETE', headers: headers() }); loadAll(); } 
                };

                const sendEventNotifications = async (ev) => { 
                    if(!confirm('Deseja disparar as mensagens de WhatsApp para todos os voluntários deste evento?')) return; 
                    const r = await fetch('/schedules/notify-event', { method: 'POST', headers: headers(), body: JSON.stringify({ event_name: ev.event_name, event_date: ev.event_date }) }); 
                    const res = await r.json(); 
                    if(!r.ok) alert(res.detail);
                    else alert(res.message); 
                    loadAll(); 
                };

                const suggestSubstitute = async (s) => { 
                    targetSchedule.value = s; 
                    const r = await fetch(`/schedules/substitutes/${s.position_id}`, { headers: headers() }); 
                    substitutes.value = await r.json(); showModalSubs.value = true; 
                };

                const applySubstitute = async (sub) => { 
                    await fetch(`/schedules/${targetSchedule.value.id}`, { method: 'PATCH', headers: headers(), body: JSON.stringify({ member_id: sub.id }) }); 
                    showModalSubs.value = false; loadAll(); 
                };

                const openEditMember = (m) => {
                    editingMember.value = { 
                        ...m, 
                        cargo_id: m.positions.find(p => p.type === 'Cargo')?.id || '',
                        selectedFuncoes: m.positions.filter(p => p.type === 'Função').map(p => p.id),
                        data_batismo: m.data_batismo ? m.data_batismo.split('T')[0] : ''
                    };
                    showModalEdit.value = true;
                };

                const updateMember = async (memberData) => {
                    const payload = {
                        ...memberData,
                        position_ids: [
                            ...(memberData.cargo_id ? [memberData.cargo_id] : []),
                            ...memberData.selectedFuncoes
                        ],
                        data_batismo: memberData.data_batismo ? new Date(memberData.data_batismo).toISOString() : null
                    };
                    const r = await fetch(`/members/${memberData.id}`, { 
                        method: 'PUT', 
                        headers: headers(), 
                        body: JSON.stringify(payload) 
                    });
                    if (r.ok) {
                        showModalEdit.value = false; 
                        loadAll();
                    } else {
                        alert("Erro ao atualizar membro.");
                    }
                };

                const deleteMember = async (id) => {
                    if (confirm("Deseja realmente excluir esta pessoa do sistema?")) {
                        const r = await fetch(`/members/${id}`, { method: 'DELETE', headers: headers() });
                        if (r.ok) loadAll();
                        else alert("Erro ao excluir.");
                    }
                };

                const uploadDoc = async (formData) => {
                    const r = await fetch('/docs/', { 
                        method: 'POST', 
                        headers: { 'Authorization': `Bearer ${token.value}` },
                        body: formData 
                    });
                    if (r.ok) {
                        showModalUploadDoc.value = false;
                        loadAll();
                    } else {
                        alert("Erro ao subir arquivo.");
                    }
                };

                const deleteDoc = async (id) => {
                    if (confirm("Deseja apagar este documento permanentemente?")) {
                        await fetch(`/docs/${id}`, { method: 'DELETE', headers: headers() });
                        loadAll();
                    }
                };

                const getPosName = (id) => positions.value.find(p => p.id == id)?.name || '---';

                const saveTemplate = async (templateData) => {
                    if(!templateData.name || templateData.positions.length === 0) return alert("Preencha nome e funções.");
                    await fetch('/schedules/templates', { method: 'POST', headers: headers(), body: JSON.stringify(templateData) });
                    loadAll();
                };
                const deleteTemplate = async (id) => {
                    if(confirm("Excluir este organograma?")) { await fetch(`/schedules/templates/${id}`, { method: 'DELETE', headers: headers() }); loadAll(); }
                };

                onMounted(() => { if(token.value) loadAll(); });
                
                return { 
                    token, userName, churchName, tab, members, schedules, positions, documents, templates, loginData, editingMember, editingId,
                    showModalAdd, showModalAddVisitor, showModalPromote, showModalQuickAdd, showModalSubs, showModalAuto, showModalManual, showModalEdit, showModalTemplate, showModalUploadDoc,
                    targetPromotion, substitutes, groupedSchedules, quickAddData, newMember,
                    login, logout, setTab, addVisitor, addMember, openPromotion, confirmPromotion, openEditMember, updateMember, deleteMember,
                    openQuickAdd, runQuickAdd, saveEdit, removeVaga, sendEventNotifications, suggestSubstitute, applySubstitute, 
                    runAutoBatch, runManualAdd, exportPDF, getQualifiedMembers, cargos, funcoes,
                    getPosName, saveTemplate, deleteTemplate, uploadDoc, deleteDoc
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
